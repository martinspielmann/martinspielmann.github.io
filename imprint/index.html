<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://martinspielmann.de/imprint/">
  <title>Imprint | Martin Spielmann</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --link: #0969da;
      --border: #d0d7de;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --link: #58a6ff;
        --border: #30363d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 3rem 1.25rem;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.65;
    }
    main, footer {
      max-width: 680px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.75rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
      margin-top: 0;
      margin-bottom: 1rem;
    }
    a {
      color: var(--link);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    footer {
      margin-top: 3.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Imprint</h1>
    <p>
      Angaben gemäß § 5 DDG:<br>
      Martin Spielmann<br>
      Telefon: +49 151 407 48 295<br>
      E-Mail: <a href="mailto:mail@martinspielmann.de">mail@martinspielmann.de</a>
    </p>
    <p><a href="/dataprotection/">Datenschutzerklärung</a></p>
  </main>
  <footer>
    <a href="/">← Back to martinspielmann.de</a> · <a href="/dataprotection/">Data protection</a>
  </footer>
</body>
</html>
